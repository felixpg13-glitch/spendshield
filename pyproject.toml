[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spendshield"
version = "0.8.2"
description = "Policy & authorization layer between AI agents and money - ALLOW / human-approval / DENY with structured reasons, daily budgets, merchant allowlists, policy lifecycle, tamper-evident audit. Python library + MCP server. 258 tests; 11,351 adversarial attempts -> 0 unintended ALLOW."
keywords = ["ai-agent", "mcp", "payment-security", "payment-guardrails", "llm-security", "agent-safety", "spend-limit", "prompt-injection", "mcp-server", "python"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["cryptography>=41", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["spendshield*"]

[project.scripts]
spendshield-mcp = "spendshield.mcp_server:main"
