[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spendshield"
version = "0.6.0"
description = "AI Agent 付款安全层: 干跑/预算/人工确认/审计 四道闸门"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["cryptography>=41"]

[tool.setuptools]
packages = ["spendshield"]

[project.scripts]
spendshield-mcp = "spendshield.mcp_server:main"
