[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spendshield"
version = "0.7.2"
description = "AI Agent 付款安全层: 身份/意图/密钥 三道信任支柱 + 四道闸门。给 AI 定义带消费上限的数字身份, 防提示注入, 密钥不落盘。Python + MCP"
keywords = ["ai-agent", "mcp", "payment-security", "payment-guardrails", "llm-security", "agent-safety", "spend-limit", "prompt-injection", "mcp-server", "python"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["spendshield*"]

[project.scripts]
spendshield-mcp = "spendshield.mcp_server:main"
